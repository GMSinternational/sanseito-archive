<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参政党 ウェブ変化ログ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root {
  --bg: #f2efe8;
  --surface: #fafaf7;
  --surface2: #f0ede6;
  --border: #d8d3ca;
  --border-soft: #e8e3dc;
  --text: #1c1a17;
  --muted: #6a6560;
  --accent: #1a3f7a;
  --accent-light: #e4eaf5;
  --green: #2e6e2e;
  --green-bg: #e4f0e4;
  --diff-pos: #c0392b;
  --diff-neg: #27ae60;
  --src-wb:  #1a3f7a; --src-wb-bg:  #e4eaf5;
  --src-cc:  #5a3a8a; --src-cc-bg:  #ede8f8;
  --src-at:  #8a3a1a; --src-at-bg:  #f8ece4;
  --sans: 'Noto Sans JP', system-ui, sans-serif;
  --serif: 'Noto Serif JP', serif;
  --mono: 'SFMono-Regular','Consolas',monospace;
  --ctrl-h: 88px; /* controls bar height for sticky offset */
}
@media (max-width: 600px) { :root { --ctrl-h: 96px; } }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#111009; --surface:#1a1816; --surface2:#141210;
    --border:#2a2822; --border-soft:#222018;
    --text:#e2ddd4; --muted:#857f78;
    --accent:#6090d8; --accent-light:#162038;
    --green:#5ab85a; --green-bg:#182818;
    --diff-pos:#e07060; --diff-neg:#50c878;
    --src-wb:#6090d8; --src-wb-bg:#162038;
    --src-cc:#a880e8; --src-cc-bg:#281840;
    --src-at:#e89060; --src-at-bg:#401808;
  }
}
:root[data-theme="dark"] {
  --bg:#111009; --surface:#1a1816; --surface2:#141210;
  --border:#2a2822; --border-soft:#222018;
  --text:#e2ddd4; --muted:#857f78;
  --accent:#6090d8; --accent-light:#162038;
  --green:#5ab85a; --green-bg:#182818;
  --diff-pos:#e07060; --diff-neg:#50c878;
  --src-wb:#6090d8; --src-wb-bg:#162038;
  --src-cc:#a880e8; --src-cc-bg:#281840;
  --src-at:#e89060; --src-at-bg:#401808;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;}

/* ── Header ── */
.hd{background:var(--surface);border-bottom:2px solid var(--accent);padding:14px 20px 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.hd h1{font-family:var(--serif);font-size:1.2rem;font-weight:700;letter-spacing:.04em;flex-shrink:0;}
.hd-meta{font-size:.74rem;color:var(--muted);font-family:var(--mono);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.src-pill{font-size:.66rem;font-weight:500;padding:2px 7px;border-radius:10px;}
.src-pill.wb{background:var(--src-wb-bg);color:var(--src-wb);}
.src-pill.cc{background:var(--src-cc-bg);color:var(--src-cc);}
.src-pill.at{background:var(--src-at-bg);color:var(--src-at);}

/* ── Overview ── */
.overview{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px 8px;}
.ov-title{font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.year-bars{display:flex;gap:8px;align-items:flex-end;height:48px;}
.year-col{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.year-col:hover .year-label{color:var(--accent);}
.year-col.active .year-label{color:var(--accent);font-weight:700;}
.year-col.active .year-bar-wrap{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}
.year-bar-wrap{display:flex;align-items:flex-end;height:34px;gap:2px;}
.year-bar{width:10px;border-radius:2px 2px 0 0;}
.year-bar.wb{background:var(--src-wb);}
.year-bar.cc{background:var(--src-cc);}
.year-bar.at{background:var(--src-at);}
.year-bar.dim{background:var(--border);height:2px;}
.year-label{font-size:.66rem;color:var(--muted);font-family:var(--mono);}
.year-count{font-size:.6rem;color:var(--muted);font-family:var(--mono);}

/* ── Controls ── */
.controls{background:var(--surface);border-bottom:1px solid var(--border);padding:7px 20px;position:sticky;top:0;z-index:20;}
.ctrl-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:28px;}
.ctrl-row+.ctrl-row{margin-top:4px;}
.fl{font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;min-width:2.5em;}
.btn{font-family:var(--sans);font-size:.74rem;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;transition:background .1s,color .1s,border-color .1s;line-height:1.5;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.ctrl-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.search-box{font-family:var(--mono);font-size:.74rem;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);outline:none;width:160px;}
.search-box:focus{border-color:var(--accent);}
.c-info{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}

/* ── Desktop Table ── */
@media(min-width:601px){
  .card-list{display:none;}
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  thead{background:var(--surface2);position:sticky;top:var(--ctrl-h);z-index:10;}
  th{font-size:.66rem;font-weight:500;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:6px 10px;white-space:nowrap;border-bottom:1px solid var(--border);}
  th.r,td.r{text-align:right;}
  td{padding:6px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tr.url-row{cursor:pointer;}
  tr.url-row:hover td{background:var(--accent-light);}
  tr.url-row.open td{background:var(--accent-light);}
  tr.detail-row td{padding:0;}
  .td-path{font-family:var(--mono);font-size:.76rem;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .td-host{font-size:.68rem;color:var(--muted);font-family:var(--mono);white-space:nowrap;}
  .td-num{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .td-date{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap;}
  .src-dots{display:inline-flex;gap:3px;}
  .src-dot{width:7px;height:7px;border-radius:50%;}
  .src-dot.wb{background:var(--src-wb);}
  .src-dot.cc{background:var(--src-cc);}
  .src-dot.at{background:var(--src-at);}
  .spark{display:inline-flex;gap:1px;align-items:flex-end;height:18px;vertical-align:middle;}
  .spark-bar{width:4px;background:var(--border);border-radius:1px 1px 0 0;}
  .spark-bar.wb{background:var(--src-wb);}
  .spark-bar.cc{background:var(--src-cc);}
  .spark-bar.at{background:var(--src-at);}
}

/* ── Mobile Cards ── */
@media(max-width:600px){
  .tbl-wrap{display:none;}
  .card-list{display:block;}
  .card{background:var(--surface);border-bottom:1px solid var(--border-soft);padding:10px 16px;cursor:pointer;transition:background .1s;}
  .card:hover{background:var(--accent-light);}
  .card.open{background:var(--accent-light);border-left:3px solid var(--accent);}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;}
  .card-path{font-family:var(--mono);font-size:.78rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-meta{display:flex;gap:8px;align-items:center;font-size:.7rem;color:var(--muted);font-family:var(--mono);}
  .card-detail{padding:0 0 0 12px;border-left:2px solid var(--border);}
}

/* ── Chip ── */
.chip{display:inline-block;font-size:.64rem;font-weight:500;padding:1px 6px;border-radius:2px;}
.chip-top{background:var(--green-bg);color:var(--green);}
.chip-news{background:#fdf0e0;color:#7a4800;}
.chip-policy{background:#f0e8f8;color:#4a1a7a;}
.chip-election{background:#e8f0f8;color:#1a4a7a;}
.chip-other{background:var(--surface2);color:var(--muted);}
.mime-tag{display:inline-block;font-size:.6rem;font-family:var(--mono);background:var(--surface2);color:var(--muted);padding:0 4px;border-radius:2px;margin-left:4px;vertical-align:middle;}

/* ── Detail panel (shared) ── */
.detail-inner{padding:4px 12px 14px 28px;background:var(--surface);border-bottom:2px solid var(--accent);}
.detail-links{margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;}
.btn-live{font-size:.74rem;background:var(--green-bg);color:var(--green);border:1px solid var(--green);padding:2px 10px;border-radius:3px;text-decoration:none;transition:background .1s,color .1s;}
.btn-live:hover{background:var(--green);color:#fff;}
.tl{list-style:none;border-left:2px solid var(--border);padding:6px 0;}
.tl li{position:relative;padding:5px 0 5px 18px;}
.tl li::before{content:'';position:absolute;left:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--src-wb);border:2px solid var(--surface);}
.tl li.src-cc::before{background:var(--src-cc);}
.tl li.src-at::before{background:var(--src-at);}
.tl li.first-snap::before{background:var(--green);}
.tl-d{font-family:var(--mono);font-size:.76rem;font-weight:500;margin-right:6px;}
.tl-src{font-size:.62rem;padding:1px 5px;border-radius:8px;margin-right:5px;}
.tl-src.wb{background:var(--src-wb-bg);color:var(--src-wb);}
.tl-src.cc{background:var(--src-cc-bg);color:var(--src-cc);}
.tl-src.at{background:var(--src-at-bg);color:var(--src-at);}
.tl-actions{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap;}
.tl-a{font-size:.7rem;color:var(--accent);border:1px solid var(--accent);padding:1px 7px;border-radius:2px;text-decoration:none;white-space:nowrap;transition:background .1s,color .1s;}
.tl-a:hover{background:var(--accent);color:#fff;}
.tl-a.diff{border-color:var(--muted);color:var(--muted);}
.tl-a.diff:hover{background:var(--muted);color:#fff;}
.tl-sz{font-size:.68rem;font-family:var(--mono);}
.tl-sz.pos{color:var(--diff-pos);}
.tl-sz.neg{color:var(--diff-neg);}
.empty{padding:40px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

<header class="hd">
  <h1>参政党 ウェブ変化ログ</h1>
  <div class="hd-meta">
    <span>sanseito.jp</span>
    <span id="range-meta"></span>
    <span id="total-meta"></span>
    <span class="src-pill wb">Wayback</span>
    <span class="src-pill cc">CommonCrawl</span>
    <span class="src-pill at">archive.today</span>
    <a href="shibu.html" style="font-size:.72rem;color:var(--accent);text-decoration:none;margin-left:8px;">「支部」用例 →</a>
  </div>
</header>

<div class="overview">
  <div class="ov-title">年別 スナップショット数（クリックで絞り込み）</div>
  <div class="year-bars" id="year-bars"></div>
</div>

<div class="controls" id="controls">
  <div class="ctrl-row">
    <span class="fl">種別</span>
    <button class="btn active" data-cat="all">すべて</button>
    <button class="btn" data-cat="top">トップ</button>
    <button class="btn" data-cat="news">ニュース</button>
    <button class="btn" data-cat="policy">政策</button>
    <button class="btn" data-cat="election">選挙</button>
    <button class="btn" data-cat="other">その他</button>
    <div class="ctrl-right">
      <input class="search-box" type="text" id="search" placeholder="パスで絞り込み…" autocomplete="off">
      <span class="c-info" id="c-info"></span>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="fl">ソース</span>
    <button class="btn active" data-src="all">すべて</button>
    <button class="btn" data-src="wayback">Wayback</button>
    <button class="btn" data-src="commoncrawl">CC</button>
    <button class="btn" data-src="archive.today">archive.today</button>
    <span style="margin-left:8px;font-size:.68rem;color:var(--muted);">年</span>
    <button class="btn active" data-year="all">全年</button>
    <button class="btn" data-year="2020">2020</button>
    <button class="btn" data-year="2021">2021</button>
    <button class="btn" data-year="2022">2022</button>
    <button class="btn" data-year="2023">2023</button>
    <button class="btn" data-year="2024">2024</button>
    <button class="btn" data-year="2025">2025</button>
    <button class="btn" data-year="2026">2026</button>
  </div>
  <div class="ctrl-row">
    <span class="fl">形式</span>
    <button class="btn active" data-mime="all">すべて</button>
    <button class="btn" data-mime="html">HTML</button>
    <button class="btn" data-mime="pdf">PDF</button>
    <button class="btn" data-mime="jpg">JPEG</button>
    <button class="btn" data-mime="png">PNG</button>
    <button class="btn" data-mime="gif">GIF</button>
    <button class="btn" data-mime="css">CSS</button>
    <button class="btn" data-mime="js">JS</button>
    <button class="btn" data-mime="other">その他</button>
  </div>
</div>

<!-- Desktop table -->
<div class="tbl-wrap">
<table>
  <thead>
    <tr>
      <th>パス</th>
      <th>ホスト</th>
      <th>種別</th>
      <th>ソース</th>
      <th class="r">件数</th>
      <th>年別</th>
      <th>初回</th>
      <th>最終</th>
      <th>現在</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<div class="empty" id="empty" hidden>該当なし</div>
</div>

<!-- Mobile cards -->
<div class="card-list" id="card-list"></div>
<div class="empty" id="empty-m" hidden>該当なし</div>
<div id="more-wrap" style="text-align:center;padding:12px 0;display:none;">
  <button id="more-btn" class="btn" style="font-size:.85rem;padding:6px 20px;" onclick="loadMore()">さらに表示</button>
  <span id="more-info" style="margin-left:10px;font-size:.72rem;color:var(--muted);"></span>
</div>

<script>
const YEARS = ['2020','2021','2022','2023','2024','2025','2026'];
const CAT_LABEL = {top:'トップ',news:'ニュース',policy:'政策',election:'選挙',other:'その他'};
const CAT_CHIP  = {top:'chip-top',news:'chip-news',policy:'chip-policy',election:'chip-election',other:'chip-other'};
const SRC_LABEL = {wayback:'Wayback',commoncrawl:'CC','archive.today':'archive.today'};
const SRC_CLS   = {wayback:'wb',commoncrawl:'cc','archive.today':'at'};
const MIME_LABEL = {html:'HTML',pdf:'PDF',jpg:'JPEG',png:'PNG',webp:'WebP',gif:'GIF',svg:'SVG',css:'CSS',js:'JS',json:'JSON',rss:'RSS',xml:'XML',font:'Font',img:'画像',other:'その他'};

let allPages=[], filtered=[], openPath=null;
let catFilter='all', srcFilter='all', yearFilter='all', mimeFilter='all';
let pageOffset=0;
const PAGE_SIZE=200;

// detail cache: bkt -> {url: changes[]}
const detailCache = {};
function loadDetail(bkt) {
  if (detailCache[bkt]) return Promise.resolve(detailCache[bkt]);
  return fetch(`detail/${bkt}.json`).then(r=>r.json()).then(d=>{detailCache[bkt]=d;return d;});
}

// sticky offset
function updateCtrlHeight() {
  const h = document.getElementById('controls').offsetHeight;
  document.documentElement.style.setProperty('--ctrl-h', h+'px');
}

fetch('data_summary.json').then(r=>r.json()).then(data=>{
  allPages=data;
  initMeta(); initOverview(); applyFilter();
  updateCtrlHeight();
  window.addEventListener('resize', updateCtrlHeight);
});

function initMeta() {
  const total = allPages.reduce((s,p)=>s+p.count,0);
  document.getElementById('total-meta').textContent = allPages.length+'URL / '+total+'件';
  const dates = allPages.flatMap(p=>[p.first,p.last]).filter(Boolean).sort();
  if (dates.length) document.getElementById('range-meta').textContent = dates[0]+' 〜 '+dates[dates.length-1];
}

function initOverview() {
  // summaryのfirst年でURLカウント（URLが初めてアーカイブされた年）
  const by = {};
  YEARS.forEach(y=>by[y]=0);
  allPages.forEach(p=>{ const y=p.first?p.first.slice(0,4):''; if(by[y]!==undefined) by[y]++; });
  const max=Math.max(...YEARS.map(y=>by[y]),1);
  document.getElementById('year-bars').innerHTML = YEARS.map(y=>{
    const n=by[y];
    const h=Math.max(Math.round(n/max*32), n>0?2:0);
    const barsHtml = n>0
      ? `<div class="year-bar wb" style="height:${h}px" title="${y}:${n}URL"></div>`
      : `<div class="year-bar dim"></div>`;
    return `<div class="year-col" data-bar-year="${y}" onclick="clickYearBar('${y}')">
      <div class="year-bar-wrap">${barsHtml}</div>
      <div class="year-label">${y.slice(2)}</div>
      <div class="year-count">${n||'-'}</div>
    </div>`;
  }).join('');
}

function clickYearBar(y) {
  yearFilter = (yearFilter===y) ? 'all' : y;
  document.querySelectorAll('[data-year]').forEach(b=>{
    b.classList.toggle('active', b.dataset.year===(yearFilter||'all'));
  });
  document.querySelectorAll('.year-col').forEach(c=>{
    c.classList.toggle('active', c.dataset.barYear===yearFilter);
  });
  openPath=null; applyFilter();
}

function filteredChanges(p) {
  let chs = p.changes || [];
  if (srcFilter!=='all') chs = chs.filter(c=>c.source===srcFilter);
  if (yearFilter!=='all') chs = chs.filter(c=>c.y===yearFilter);
  return chs;
}

function applyFilter() {
  const q=document.getElementById('search').value.trim().toLowerCase();
  filtered = allPages.filter(p=>{
    if (catFilter!=='all' && p.cat!==catFilter) return false;
    if (mimeFilter!=='all' && p.mime!==mimeFilter) return false;
    // 年フィルタ: firstとlastの範囲にyearFilterが含まれるURLのみ
    if (yearFilter!=='all') {
      const fy = p.first ? p.first.slice(0,4) : '';
      const ly = p.last  ? p.last.slice(0,4)  : '';
      if (!fy || fy > yearFilter || ly < yearFilter) return false;
    }
    if (srcFilter!=='all' && !(p.srcs||[]).includes(srcFilter)) return false;
    if (q && !p.url.toLowerCase().includes(q) && !p.path.toLowerCase().includes(q)) return false;
    return true;
  });
  pageOffset=0;
  document.getElementById('c-info').textContent = filtered.length+'URL';
  renderTable(); renderCards();
}

function updateMore() {
  const wrap=document.getElementById('more-wrap');
  const shown=Math.min(pageOffset+PAGE_SIZE, filtered.length);
  if(shown < filtered.length){
    wrap.style.display='block';
    document.getElementById('more-info').textContent=shown+' / '+filtered.length+'件表示中';
  } else {
    wrap.style.display='none';
  }
}
function loadMore() {
  pageOffset+=PAGE_SIZE;
  renderTable(); renderCards();
}

function srcDots(changes) {
  const srcs=[...new Set(changes.map(c=>c.source))];
  return srcs.map(s=>`<div class="src-dot ${SRC_CLS[s]||''}" title="${SRC_LABEL[s]||s}"></div>`).join('');
}

function sparkHtml(changes) {
  const by={};YEARS.forEach(y=>by[y]={wb:0,cc:0,at:0,total:0});
  changes.forEach(c=>{const y=c.y;if(!by[y])return;const s=SRC_CLS[c.source]||'wb';by[y][s]++;by[y].total++;});
  const max=Math.max(...YEARS.map(y=>by[y].total),1);
  return YEARS.map(y=>{
    const d=by[y];
    const h=Math.max(Math.round(d.total/max*16),d.total>0?2:0);
    const cls=d.cc>d.wb&&d.cc>d.at?'cc':d.at>d.wb?'at':d.total>0?'wb':'';
    return `<div class="spark-bar ${cls}" style="height:${Math.max(h,1)}px" title="${y}:${d.total}"></div>`;
  }).join('');
}

function liveLink(url) {
  return `<a href="${url}" target="_blank" rel="noopener" class="btn-live">現在のページ</a>`;
}

function detailHtml(p) {
  const chs = filteredChanges(p);
  const tlHtml = chs.map((c,i)=>{
    const isFirst=i===0;
    const srcCls=SRC_CLS[c.source]||'wb';
    const srcLbl=SRC_LABEL[c.source]||c.source;
    let szHtml='';
    if(c.diffFmt){const cls=c.diff>0?'pos':c.diff<0?'neg':'';szHtml=`<span class="tl-sz ${cls}">${c.diffFmt}</span>`;}
    else if(c.bytes){szHtml=`<span class="tl-sz">${(c.bytes/1024).toFixed(1)}KB</span>`;}
    const diffLink=c.diffUrl?`<a class="tl-a diff" href="${c.diffUrl}" target="_blank" rel="noopener">差分</a>`:'';
    const viewLink=c.wb?`<a class="tl-a" href="${c.wb}" target="_blank" rel="noopener">表示</a>`:'';
    return `<li class="${isFirst?'first-snap':''} src-${srcCls}">
      <span class="tl-d">${c.d}</span><span class="tl-src ${srcCls}">${srcLbl}</span>
      <span class="tl-actions">${viewLink}${diffLink}${szHtml}</span>
    </li>`;
  }).join('');
  return `<div class="detail-inner">
    <div class="detail-links">${liveLink(p.url)}</div>
    <ul class="tl">${tlHtml}</ul>
  </div>`;
}

function rowHtmlFor(p, chs) {
  const chipCls=CAT_CHIP[p.cat]||'chip-other';
  const label=CAT_LABEL[p.cat]||p.cat;
  const mimeTag = p.mime ? `<span class="mime-tag">${p.mime}</span>` : '';
  return `<tr class="url-row${openPath===p.url?' open':''}" onclick="toggleRow('${p.url.replace(/'/g,"\\'")}')">
    <td class="td-path" title="${p.url}">${p.path}${mimeTag}</td>
    <td class="td-host">${p.host}</td>
    <td><span class="chip ${chipCls}">${label}</span></td>
    <td><div class="src-dots">${chs.length?srcDots(chs):''}</div></td>
    <td class="td-num r">${p.count}</td>
    <td><div class="spark">${chs.length?sparkHtml(chs):''}</div></td>
    <td class="td-date">${p.first||''}</td>
    <td class="td-date">${p.last||''}</td>
    <td><a href="${p.url}" target="_blank" rel="noopener" class="btn-live" onclick="event.stopPropagation()">現在</a></td>
  </tr>`;
}

function renderTable() {
  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty');
  if(!filtered.length){tbody.innerHTML='';empty.hidden=false;updateMore();return;}
  empty.hidden=true;
  const slice=filtered.slice(0, pageOffset+PAGE_SIZE);
  tbody.innerHTML=slice.map(p=>{
    const chs=filteredChanges(p);
    const row=rowHtmlFor(p,chs);
    if(openPath!==p.url) return row;
    return row+`<tr class="detail-row"><td colspan="9">${detailHtml(p)}</td></tr>`;
  }).join('');
  updateMore();
}

function renderCards() {
  const list=document.getElementById('card-list');
  const empty=document.getElementById('empty-m');
  if(!filtered.length){list.innerHTML='';empty.hidden=false;return;}
  empty.hidden=true;
  const slice=filtered.slice(0, pageOffset+PAGE_SIZE);
  list.innerHTML=slice.map(p=>{
    const chs=filteredChanges(p);
    const chipCls=CAT_CHIP[p.cat]||'chip-other';
    const label=CAT_LABEL[p.cat]||p.cat;
    const isOpen=openPath===p.url;
    const cardHtml=`<div class="card${isOpen?' open':''}" onclick="toggleRow('${p.url.replace(/'/g,"\\'")}')">
      <div class="card-top">
        <span class="chip ${chipCls}">${label}</span>
        <span class="card-path">${p.path}</span>
        <span style="font-size:.7rem;color:var(--muted);font-family:var(--mono);white-space:nowrap">${p.count}件</span>
      </div>
      <div class="card-meta">
        <span>${p.first||''}</span><span>〜</span><span>${p.last||''}</span>
        ${p.mime?`<span class="mime-tag">${p.mime}</span>`:''}
      </div>
    </div>`;
    if(!isOpen) return cardHtml;
    return cardHtml+`<div>${detailHtml(p)}</div>`;
  }).join('');
}

function toggleRow(url) {
  if(openPath===url){openPath=null;renderTable();renderCards();return;}
  openPath=url;
  const p=allPages.find(x=>x.url===url);
  if(!p){return;}
  if(p.changes){renderTable();renderCards();return;}
  // detail をまだ持っていない場合はfetch
  loadDetail(p.bkt).then(d=>{
    p.changes=d[url]||[];
    renderTable();renderCards();
    const el=document.querySelector('.url-row.open, .card.open');
    if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
  });
  renderTable();renderCards(); // ローディング状態で先に再描画
}

// filters
document.querySelectorAll('[data-cat]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-cat]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); catFilter=btn.dataset.cat; openPath=null; applyFilter();
  });
});
document.querySelectorAll('[data-src]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-src]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); srcFilter=btn.dataset.src; openPath=null; applyFilter();
  });
});
document.querySelectorAll('[data-mime]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-mime]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); mimeFilter=btn.dataset.mime; openPath=null; applyFilter();
  });
});
document.querySelectorAll('[data-year]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const y=btn.dataset.year;
    yearFilter=(yearFilter===y&&y!=='all')?'all':y;
    document.querySelectorAll('[data-year]').forEach(b=>b.classList.toggle('active',b.dataset.year===(yearFilter||'all')));
    document.querySelectorAll('.year-col').forEach(c=>c.classList.toggle('active',c.dataset.barYear===yearFilter));
    openPath=null; applyFilter();
  });
});
document.getElementById('search').addEventListener('input',()=>{openPath=null;applyFilter();});
</script>
</body>
</html>
