<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参政党 ウェブ変化ログ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root {
  --bg: #f4f0e8;
  --surface: #fffefb;
  --surface2: #f7f3ec;
  --border: #d4cfc6;
  --border-soft: #e6e1d8;
  --text: #1c1a17;
  --muted: #6a6560;
  --accent: #1a3f7a;
  --accent-hover: #142e5a;
  --accent-soft: #e8eef7;
  --green: #2a6b2a;
  --green-bg: #e8f0e8;
  --red: #8b2222;
  --red-bg: #f8e8e8;
  --sans: 'Noto Sans JP', system-ui, sans-serif;
  --serif: 'Noto Serif JP', serif;
  --mono: 'SFMono-Regular','Consolas',monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131210;
    --surface: #1c1a17;
    --surface2: #161412;
    --border: #2e2b26;
    --border-soft: #252320;
    --text: #e4e0d8;
    --muted: #8a8680;
    --accent: #5a8fd4;
    --accent-hover: #7aaae0;
    --accent-soft: #1a2840;
    --green: #6abf6a;
    --green-bg: #1e2e1e;
    --red: #e07070;
    --red-bg: #2e1a1a;
  }
}
:root[data-theme="dark"] {
  --bg: #131210;
  --surface: #1c1a17;
  --surface2: #161412;
  --border: #2e2b26;
  --border-soft: #252320;
  --text: #e4e0d8;
  --muted: #8a8680;
  --accent: #5a8fd4;
  --accent-hover: #7aaae0;
  --accent-soft: #1a2840;
  --green: #6abf6a;
  --green-bg: #1e2e1e;
  --red: #e07070;
  --red-bg: #2e1a1a;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; min-height: 100vh; }

/* Layout */
.layout { display: grid; grid-template-rows: auto auto 1fr; min-height: 100vh; }

/* Header */
.site-header {
  background: var(--surface);
  border-bottom: 2px solid var(--accent);
  padding: 18px 24px 14px;
}
.site-header h1 {
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.site-header .meta {
  font-size: 0.76rem;
  color: var(--muted);
  font-family: var(--mono);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

/* Controls */
.controls {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 20;
}
.filter-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.btn-filter {
  font-family: var(--sans);
  font-size: 0.78rem;
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  line-height: 1.5;
}
.btn-filter:hover { border-color: var(--accent); color: var(--accent); }
.btn-filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.count-info { font-size: 0.75rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.search-wrap { position: relative; }
.search-wrap input {
  font-family: var(--mono);
  font-size: 0.78rem;
  padding: 3px 10px 3px 26px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg);
  color: var(--text);
  width: 200px;
  outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap::before {
  content: '🔍';
  position: absolute;
  left: 7px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.7rem;
  pointer-events: none;
}

/* Main area: sidebar + detail */
.main-area {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: 0;
  overflow: hidden;
}

/* URL list */
.url-list {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  height: calc(100vh - 106px);
}
.url-item {
  display: block;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  transition: background .1s;
}
.url-item:hover { background: var(--accent-soft); }
.url-item.selected { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 11px; }
.url-item-path {
  font-family: var(--mono);
  font-size: 0.78rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.url-item-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 2px;
}
.chip {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 2px;
}
.chip-top { background: var(--green-bg); color: var(--green); }
.chip-news { background: #fdf0e0; color: #7a4800; }
.chip-policy { background: #f0e8f8; color: #4a1a7a; }
.chip-election { background: #e8f0f8; color: #1a4a7a; }
.chip-other { background: var(--surface2); color: var(--muted); }
.url-item-count {
  font-size: 0.7rem;
  color: var(--muted);
  font-family: var(--mono);
}
.url-item-dates {
  font-size: 0.68rem;
  color: var(--muted);
  font-family: var(--mono);
  margin-left: auto;
}

/* Detail panel */
.detail {
  overflow-y: auto;
  height: calc(100vh - 106px);
  padding: 20px 24px;
}
.detail-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  font-size: 0.9rem;
}
.detail-header {
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.detail-url {
  font-family: var(--mono);
  font-size: 0.85rem;
  word-break: break-all;
  margin-bottom: 6px;
}
.detail-url a { color: var(--accent); text-decoration: none; }
.detail-url a:hover { text-decoration: underline; }
.detail-stat { font-size: 0.75rem; color: var(--muted); }

/* Timeline */
.timeline { position: relative; padding-left: 20px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: var(--border);
}
.tl-item {
  position: relative;
  margin-bottom: 16px;
}
.tl-dot {
  position: absolute;
  left: -17px;
  top: 5px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid var(--surface);
  background: var(--accent);
}
.tl-dot.first { background: var(--green); }
.tl-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 14px;
}
.tl-card:hover { border-color: var(--accent); }
.tl-date {
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 4px;
}
.tl-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tl-link {
  font-size: 0.74rem;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 2px 9px;
  border-radius: 2px;
  text-decoration: none;
  transition: background .1s, color .1s;
  white-space: nowrap;
}
.tl-link:hover { background: var(--accent); color: #fff; }
.tl-diff-link { border-color: var(--muted); color: var(--muted); }
.tl-diff-link:hover { background: var(--muted); color: #fff; }
.tl-size {
  font-size: 0.72rem;
  color: var(--muted);
  font-family: var(--mono);
}
.diff-pos { color: var(--red); }
.diff-neg { color: var(--green); }

.empty-panel { padding: 40px 24px; text-align: center; color: var(--muted); font-size: 0.85rem; }

@media (max-width: 700px) {
  .main-area { grid-template-columns: 1fr; }
  .url-list { height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .detail { height: auto; min-height: 60vh; }
}
</style>
</head>
<body>
<div class="layout">

<header class="site-header">
  <h1>参政党 ウェブ変化ログ</h1>
  <div class="meta">
    <span>sanseito.jp</span>
    <span id="range-meta">-</span>
    <span id="total-meta">-</span>
    <span>Wayback Machine</span>
  </div>
</header>

<div class="controls">
  <span class="filter-label">種別</span>
  <button class="btn-filter active" data-cat="all">すべて</button>
  <button class="btn-filter" data-cat="top">トップ</button>
  <button class="btn-filter" data-cat="news">ニュース</button>
  <button class="btn-filter" data-cat="policy">政策</button>
  <button class="btn-filter" data-cat="election">選挙</button>
  <button class="btn-filter" data-cat="other">その他</button>
  <div class="sep"></div>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="パスで絞り込み…" autocomplete="off">
  </div>
  <span class="count-info" id="count-info"></span>
</div>

<div class="main-area">
  <div class="url-list" id="url-list"></div>
  <div class="detail" id="detail">
    <div class="detail-empty">左のURLを選択してください</div>
  </div>
</div>

</div><!-- .layout -->

<script>
let allPages = [];
let filtered = [];
let selectedIdx = -1;
let catFilter = 'all';

const catLabels = { top: 'トップ', news: 'ニュース', policy: '政策', election: '選挙', other: 'その他' };
const catChip = { top: 'chip-top', news: 'chip-news', policy: 'chip-policy', election: 'chip-election', other: 'chip-other' };

fetch('data.json').then(r=>r.json()).then(data => {
  allPages = data;
  updateMeta();
  applyFilter();
});

function updateMeta() {
  const totalChanges = allPages.reduce((s,p) => s + p.count, 0);
  document.getElementById('total-meta').textContent = `${allPages.length}URL / ${totalChanges}件の変化`;
  const allDates = allPages.flatMap(p => [p.first, p.last]).filter(Boolean).sort();
  if (allDates.length) {
    document.getElementById('range-meta').textContent = `${allDates[0]} 〜 ${allDates[allDates.length-1]}`;
  }
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  filtered = allPages.filter(p => {
    if (catFilter !== 'all' && p.cat !== catFilter) return false;
    if (q && !p.path.toLowerCase().includes(q) && !p.url.toLowerCase().includes(q)) return false;
    return true;
  });
  const totalChanges = filtered.reduce((s,p) => s + p.count, 0);
  document.getElementById('count-info').textContent = `${filtered.length}URL / ${totalChanges}件`;
  renderList();
}

function renderList() {
  const el = document.getElementById('url-list');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-panel">該当なし</div>';
    return;
  }
  el.innerHTML = filtered.map((p,i) => {
    const chipClass = catChip[p.cat] || 'chip-other';
    const label = catLabels[p.cat] || p.cat;
    return `<div class="url-item${selectedIdx===i?' selected':''}" data-i="${i}" onclick="selectPage(${i})">
      <div class="url-item-path" title="${p.url}">${p.path}</div>
      <div class="url-item-meta">
        <span class="chip ${chipClass}">${label}</span>
        <span class="url-item-count">${p.count}回変化</span>
        <span class="url-item-dates">${p.first} 〜 ${p.last}</span>
      </div>
    </div>`;
  }).join('');
}

function selectPage(i) {
  selectedIdx = i;
  renderList();
  const p = filtered[i];
  const chipClass = catChip[p.cat] || 'chip-other';
  const label = catLabels[p.cat] || p.cat;

  const changes = p.changes;
  const timelineHtml = changes.map((c, j) => {
    const isFirst = j === 0;
    let diffHtml = '';
    if (c.diffFmt) {
      const cls = (c.diff > 0) ? 'diff-pos' : (c.diff < 0 ? 'diff-neg' : '');
      diffHtml = `<span class="tl-size ${cls}">${c.diffFmt}</span>`;
    } else if (c.bytes) {
      diffHtml = `<span class="tl-size">${(c.bytes/1024).toFixed(1)}KB</span>`;
    }
    const diffLinkHtml = c.diffUrl
      ? `<a class="tl-link tl-diff-link" href="${c.diffUrl}" target="_blank" rel="noopener">差分</a>`
      : '';
    return `<div class="tl-item">
      <div class="tl-dot${isFirst?' first':''}"></div>
      <div class="tl-card">
        <div class="tl-date">${c.d}${isFirst?' <small style="color:var(--muted);font-weight:400">(初回)</small>':''}</div>
        <div class="tl-actions">
          <a class="tl-link" href="${c.wb}" target="_blank" rel="noopener">スナップショット</a>
          ${diffLinkHtml}
          ${diffHtml}
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('detail').innerHTML = `
    <div class="detail-header">
      <div class="detail-url"><a href="${p.url}" target="_blank" rel="noopener">${p.url}</a></div>
      <div class="detail-stat">
        <span class="chip ${chipClass}">${label}</span>
        &nbsp;${p.count}回の内容変化 &nbsp;/&nbsp; ${p.first} 〜 ${p.last}
      </div>
    </div>
    <div class="timeline">${timelineHtml}</div>
  `;
}

document.querySelectorAll('[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    catFilter = btn.dataset.cat;
    selectedIdx = -1;
    document.getElementById('detail').innerHTML = '<div class="detail-empty">左のURLを選択してください</div>';
    applyFilter();
  });
});

document.getElementById('search').addEventListener('input', () => {
  selectedIdx = -1;
  document.getElementById('detail').innerHTML = '<div class="detail-empty">左のURLを選択してください</div>';
  applyFilter();
});
</script>
</body>
</html>
