<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>支部 用例データベース</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root {
  --bg: #f5f3ef;
  --surface: #fdfcfa;
  --surface2: #eeebe4;
  --border: #d8d3ca;
  --text: #1a1917;
  --muted: #6b6560;
  --accent: #1e3a6e;
  --accent-light: #e2eaf6;
  --hl-bg: #fff0c0;
  --hl-text: #7a5500;
  --tag-bg: #e8e4dc;
  --sans: 'Noto Sans JP', system-ui, sans-serif;
  --serif: 'Noto Serif JP', serif;
  --mono: 'SFMono-Regular', 'Consolas', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0e0c;
    --surface: #161410;
    --surface2: #1c1a16;
    --border: #2a2822;
    --text: #e0dbd4;
    --muted: #857f78;
    --accent: #6890d8;
    --accent-light: #111c30;
    --hl-bg: #3a2e00;
    --hl-text: #f0c840;
    --tag-bg: #222018;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0e0c; --surface: #161410; --surface2: #1c1a16;
  --border: #2a2822; --text: #e0dbd4; --muted: #857f78;
  --accent: #6890d8; --accent-light: #111c30;
  --hl-bg: #3a2e00; --hl-text: #f0c840; --tag-bg: #222018;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.7; }

/* header */
.hd {
  background: var(--surface);
  border-bottom: 2px solid var(--accent);
  padding: 14px 20px 12px;
}
.hd-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hd h1 { font-family: var(--serif); font-size: 1.15rem; color: var(--accent); letter-spacing: .02em; }
.hd-sub { font-size: .72rem; font-family: var(--mono); color: var(--muted); }
.hd-sub b { color: var(--text); }

/* search bar */
.search-wrap {
  position: sticky;
  top: 0;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  z-index: 10;
}
.search-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search-box {
  flex: 1; min-width: 160px;
  font-size: .88rem; font-family: var(--sans);
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  color: var(--text);
}
.search-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sort-sel {
  font-size: .78rem; font-family: var(--sans);
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.result-count { font-size: .72rem; font-family: var(--mono); color: var(--muted); white-space: nowrap; }

/* list */
.list-wrap { max-width: 820px; margin: 0 auto; padding: 16px 20px 48px; }

.row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 8px;
  overflow: hidden;
}
.row-head {
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  cursor: pointer;
}
.row-head:hover { background: var(--accent-light); }
.row-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cnt {
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: .72rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 6px;
  color: var(--muted);
  margin-top: 2px;
  min-width: 32px;
  text-align: center;
}
.cnt.many { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.sent {
  font-size: .92rem;
  line-height: 1.75;
  flex: 1;
  word-break: break-all;
}
mark { background: var(--hl-bg); color: var(--hl-text); font-weight: 700; border-radius: 2px; padding: 0 1px; }
.toggle-icon { flex-shrink: 0; font-size: .7rem; color: var(--muted); margin-top: 4px; transition: transform .15s; }
.row.open .toggle-icon { transform: rotate(90deg); }

.row-detail {
  display: none;
  border-top: 1px solid var(--border);
  padding: 8px 14px 12px;
}
.row.open .row-detail { display: block; }
.meta-line { font-size: .72rem; font-family: var(--mono); color: var(--muted); margin-bottom: 6px; display: flex; gap: 16px; flex-wrap: wrap; }
.meta-line span b { color: var(--text); }
.paths { display: flex; flex-wrap: wrap; gap: 4px; }
.path-tag {
  font-size: .68rem; font-family: var(--mono);
  background: var(--tag-bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 6px;
  color: var(--muted);
}
.wb-link { font-size: .68rem; color: var(--accent); text-decoration: none; }
.wb-link:hover { text-decoration: underline; }

.row-head-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-path { font-family: var(--mono); font-size: .78rem; color: var(--accent); }
.row-preview { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-body { padding: 8px 0 4px; }
.ex-para { font-size: .92rem; line-height: 2; word-break: break-all; margin: 0 0 1em; }
.ex-para br { display: block; content: ''; margin-top: .5em; }
.ellipsis { text-align: center; font-size: .8rem; color: var(--muted); padding: 8px 0; letter-spacing: .1em; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: .9rem; }
.loading { text-align: center; padding: 60px 20px; color: var(--muted); }
</style>
</head>
<body>

<div class="hd">
  <div class="hd-inner">
    <h1>支部 用例データベース</h1>
    <span class="hd-sub">参政党アーカイブ (〜2021-09-20) — <b id="total-count">…</b></span>
  </div>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <input class="search-box" type="search" id="q" placeholder="用例を検索…" autocomplete="off">
    <select class="sort-sel" id="sort">
      <option value="first">初出日順</option>
      <option value="count">出現回数順</option>
      <option value="last">最終日順</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>
</div>

<div class="list-wrap" id="list">
  <div class="loading">読み込み中…</div>
</div>

<script>
let items = [];

function hl(s) {
  return s.replace(/支部/g, '<mark>支部</mark>');
}

function urlPath(url) {
  try {
    const m = url.match(/https?:\/\/[^/]+(\/[^?#]*)/);
    return m ? m[1].replace(/\/$/, '') || '/' : url;
  } catch(e) { return url; }
}

function renderGroups(groups) {
  const filtered = groups.filter(g => g.some(s => s.includes('支部')));
  return filtered.map(g => `<p class="ex-para">${g.map(s => hl(s)).join('<br>')}</p>`).join('<div class="ellipsis">…</div>');
}

function render(filtered) {
  const list = document.getElementById('list');
  document.getElementById('result-count').textContent = filtered.length + ' ページ';
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">該当するページがありません</div>';
    return;
  }
  list.innerHTML = filtered.map((item, i) => {
    const many = item.count >= 3;
    // 先頭グループの冒頭テキストをプレビューとして表示
    const preview = item.groups[0] ? item.groups[0].join('').slice(0, 60) + (item.groups[0].join('').length > 60 ? '…' : '') : '';
    return `<div class="row" id="row${i}">
      <div class="row-head" tabindex="0" role="button" aria-expanded="false"
           onclick="toggle(${i})" onkeydown="if(event.key==='Enter'||event.key===' ')toggle(${i})">
        <span class="cnt${many?' many':''}">${item.count}</span>
        <div class="row-head-text">
          <span class="row-path">${item.path}</span>
          <span class="row-preview">${hl(preview)}</span>
        </div>
        <span class="toggle-icon">▶</span>
      </div>
      <div class="row-detail">
        <div class="meta-line">
          <span>初出 <b>${item.first}</b></span>
          <span>最終 <b>${item.last}</b></span>
          <span>スナップ <b>${item.count}</b> 件</span>
          <a class="wb-link" href="${item.wb}" target="_blank" rel="noopener">アーカイブで見る →</a>
        </div>
        <div class="ex-body">${renderGroups(item.groups)}</div>
      </div>
    </div>`;
  }).join('');
}

function toggle(i) {
  const row = document.getElementById('row' + i);
  const head = row.querySelector('.row-head');
  const open = row.classList.toggle('open');
  head.setAttribute('aria-expanded', open);
}

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;
  let filtered = q ? items.filter(x => x.text.toLowerCase().includes(q)) : items.slice();
  filtered.sort((a, b) => {
    if (sort === 'count') return b.count - a.count;
    if (sort === 'first') return (a.first||'').localeCompare(b.first||'');
    if (sort === 'last')  return (b.last||'').localeCompare(a.last||'');
    return 0;
  });
  render(filtered);
}

fetch('shibu_results.json').then(r => r.json()).then(data => {
  // URL単位でまとめる。同じURLの複数スナップは重複除去して統合。
  // groups: [[セクション内の文, ...], ...] — セクション間は「…」で区切って表示
  const map = {};
  data.forEach(d => {
    const key = d.url;
    const rawGroups = d.groups || (d.sentences || d.contexts || []).map(s => [s]);
    if (!rawGroups.length) return;
    if (!map[key]) map[key] = { url: key, path: urlPath(key), groups: [], seenFrags: new Set(), count: 0, first: d.date, last: d.date, wb: d.wb };
    map[key].count++;
    if (d.date < map[key].first) map[key].first = d.date;
    if (d.date > map[key].last)  map[key].last  = d.date;
    // 各グループを重複除去しながら統合
    rawGroups.forEach(grp => {
      const newFrags = grp.map(s => s.trim()).filter(s => s && !map[key].seenFrags.has(s));
      newFrags.forEach(s => map[key].seenFrags.add(s));
      if (newFrags.length) map[key].groups.push(newFrags);
    });
  });
  items = Object.values(map).map(x => {
    // 検索用テキスト
    const text = x.groups.map(g => g.join('')).join(' ');
    return { ...x, text };
  });
  document.getElementById('total-count').textContent = items.length + ' ページ';
  applyFilter();
});

let debounce;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(applyFilter, 150);
});
document.getElementById('sort').addEventListener('change', applyFilter);
</script>
</body>
</html>
